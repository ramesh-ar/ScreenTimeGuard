apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    // Default RN autolinking / bundling config — no overrides needed.
}

/**
 * Set this to true to enable Proguard/R8 code shrinking in release builds.
 * Left false by default to avoid extra proguard-rule debugging on a first build.
 */
def enableProguardInReleaseBuilds = false

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.screentimeguard"

    defaultConfig {
        applicationId "com.screentimeguard"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (System.getenv("RELEASE_STORE_FILE")) {
                storeFile file(System.getenv("RELEASE_STORE_FILE"))
                storePassword System.getenv("RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // IMPORTANT: always use the "release" build TYPE, never "debug" —
            // the release build type is what makes Gradle bundle the JS into
            // assets. A debug-type build expects Metro running and produces
            // an "Unable to load script" error when sideloaded standalone.
            //
            // Only the SIGNING KEY changes based on whether a production
            // keystore was provided via CI secrets: falls back to the
            // auto-generated debug key so the APK is still installable.
            signingConfig = System.getenv("RELEASE_STORE_FILE") ?
                signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
}
