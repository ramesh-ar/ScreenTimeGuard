name: Build Android APK

# Triggers:
# - Any push to main -> builds APK and uploads as a workflow artifact
# - Pushing a tag like v1.0.0 -> also creates a GitHub Release with the APK attached
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # No cache: 'npm' here on purpose — that requires a committed
          # package-lock.json to key the cache off of. Add it back once
          # you've run `npm install` locally and committed the lock file.

      - name: Install JS dependencies
        run: npm install

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode release keystore
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Generate Gradle wrapper
        # This repo doesn't commit the gradle-wrapper.jar binary, so we
        # provision a real `gradle` here and use it to materialize the
        # wrapper (gradlew, gradlew.bat, gradle-wrapper.jar) before building.
        uses: gradle/actions/setup-gradle@v4

      - name: Create wrapper files
        run: |
          cd android
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew

      - name: Build release APK
        env:
          # Only set RELEASE_STORE_FILE when the keystore secret actually
          # exists — the build.gradle signing config checks this env var to
          # decide between the production keystore and the debug fallback.
          RELEASE_STORE_FILE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && 'release.keystore' || '' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cd android
          # Always build the RELEASE build type — this is what makes Gradle
          # bundle the JS into assets. Never fall back to assembleDebug: a
          # debug-type build expects Metro running and produces the
          # "Unable to load script" error when sideloaded standalone.
          ./gradlew assembleRelease

      - name: Locate APK
        id: locate_apk
        run: |
          echo "apk_path=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: screentimeguard-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate_apk.outputs.apk_path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
